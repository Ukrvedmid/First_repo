name: Job agent checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app

      - name: Import application
        run: python -c "import app.main"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for filename in (
              "config.yaml",
              "extra_profile.yaml",
              "extra_sources.yaml",
              "source_overrides.yaml",
          ):
              with Path(filename).open("r", encoding="utf-8") as stream:
                  data = yaml.safe_load(stream)
              if not isinstance(data, dict):
                  raise SystemExit(f"{filename}: expected a YAML mapping")
              print(f"{filename}: OK")
          PY
