sources:
  # Official German Federal Employment Agency. These searches cover both
  # direct maritime jobs and realistic ship-to-shore transition routes.
  - name: "Bundesagentur Maritime Engineering"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Ingenieur%2Fin%20-%20Schiffbau%20und%20Meerestechnik"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Schiffsbetriebstechnik"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Technical%20Superintendent"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Marine%20Surveyor"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Technischer%20Inspektor%20Schifffahrt"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Projektleiter%20Schiffbau"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Projektingenieur%20Schiffbau"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Serviceingenieur%20Marine"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Field%20Service%20Engineer%20Marine"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Inbetriebnahmeingenieur%20Schiffbau"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Instandhaltungsingenieur"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Betriebsingenieur"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Offshore%20Wind%20Engineer"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Servicetechniker%20Schiff"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Production%20Manager%20SOV"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=O%26M%20Manager%20Offshore"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Operations%20Manager%20Offshore%20Wind"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Technischer%20Experte%20Marine"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Schiffsinspektor"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Instandhaltungskoordinator"
    allowed_domains: ["arbeitsagentur.de"]
    follow_url_contains: ["/jobsuche/suche?"]
    job_url_contains: ["/jobsuche/jobdetail/"]
    max_pages: 520
    max_jobs: 850

  # Kongsberg publishes its complete vacancy list server-side, including
  # maritime, propulsion, automation, DP, subsea and field-service roles.
  - name: "Kongsberg Global Maritime"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://www.kongsberg.com/careers/vacancies/"
    allowed_domains: ["kongsberg.com"]
    follow_url_contains: ["/careers/vacancies/"]
    job_url_regex: "/careers/vacancies/[^/?#]+/?$"
    max_pages: 260
    max_jobs: 500

  # Hapag-Lloyd's official Softgarden career board. The source remains useful
  # even when no matching Germany vacancy is open on a given day.
  - name: "Hapag-Lloyd Global Careers"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://hapaglloyd.softgarden.io/en/vacancies"
    allowed_domains: ["hapaglloyd.softgarden.io"]
    follow_url_contains: ["/en/vacancies"]
    job_url_regex: "/job/[0-9]+/"
    max_pages: 250
    max_jobs: 500

  # Classification, plan approval, survey and maritime advisory vacancies.
  - name: "RINA Germany Marine"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://careers.rina.org/search/?q=&locationsearch=Germany"
    allowed_domains: ["careers.rina.org"]
    follow_url_contains: ["/search/", "/go/"]
    job_url_contains: ["/job/"]
    max_pages: 180
    max_jobs: 400

  - name: "Lloyds Register Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://jobs.lr.org/search/?q=&locationsearch=Germany"
    allowed_domains: ["jobs.lr.org"]
    follow_url_contains: ["/search/", "/go/"]
    job_url_contains: ["/job/"]
    max_pages: 180
    max_jobs: 400

  # German shipbuilding and ship-operation engineering. Fassmer currently
  # publishes project-management, commissioning, service and shipbuilding jobs
  # directly on this server-rendered career board.
  - name: "Fassmer Shipbuilding Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://www.fassmer.de/de/karriere/stellenangebote/"
    allowed_domains: ["fassmer.de"]
    follow_url_contains: ["/de/karriere/stellenangebote/"]
    job_url_regex: "/de/karriere/stellenangebote/[^/?#]+/?$"
    max_pages: 180
    max_jobs: 350

  # Briese's listing page links to its official Onlyfy/Jobbase vacancy pages.
  # This is one of the highest-value sources for a Chief Engineer moving into
  # technical inspection, drydock and newbuilding work in Germany.
  - name: "Briese Ship Management Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://briese.de/briese-schiffahrt/career"
    allowed_domains:
      - "briese.de"
      - "briese-schiffahrts-gmbh-co-kg.onlyfy.jobs"
      - "briese-schiffahrts-gmbh-co-kg.jobbase.io"
    follow_url_contains:
      - "/briese-schiffahrt/career"
      - "/job/"
    job_url_regex: "/job/[a-z0-9]+/?$"
    max_pages: 120
    max_jobs: 250

  # German offshore-wind vessel operator with both shore and sea vacancies.
  - name: "OS Energy Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://os-energy.de/de/karriere/"
    allowed_domains: ["os-energy.de"]
    follow_url_contains: ["/de/karriere/"]
    job_url_regex: "/(chief-engineer|chief-officer|verstaerkung-im-crewing|auszubildende-n-zum-zur-schifffahrtskaufmann)[^/?#]*/?$"
    max_pages: 80
    max_jobs: 100

  # Current Marine & Offshore surveying, classification and inspection jobs.
  - name: "Bureau Veritas Germany Marine"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://careers.bureauveritas.com/go/Our-job-offers/4113401/?q=&sortColumn=referencedate&sortDirection=desc"
    allowed_domains: ["careers.bureauveritas.com"]
    follow_url_contains: ["/go/Our-job-offers/"]
    job_url_contains: ["/Germany/job/"]
    max_pages: 260
    max_jobs: 650

  # Marine propulsion, commissioning, technical support and field repair.
  - name: "SCHOTTEL Marine Propulsion"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://jobs.schottel.de/"
    allowed_domains: ["jobs.schottel.de"]
    follow_url_contains: ["jobs.schottel.de/"]
    job_url_regex: "/[^/?#]+-de-j[0-9]+\\.html$"
    job_url_excludes: ["Ausbildung", "Duales-Studium", "Praktikum"]
    max_pages: 180
    max_jobs: 350

  # German and international offshore-wind O&M, SOV and asset-management jobs.
  - name: "RWE Offshore Wind Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://jobs.rwe.com/RWE/go/Operations-%26-Technicians_RWE-%28DE%29/8742001/"
      - "https://jobs.rwe.com/RWE/go/All-Jobs_RWE-%28DE%29/8741501/"
    allowed_domains: ["jobs.rwe.com"]
    follow_url_contains: ["/RWE/go/"]
    job_url_contains: ["/RWE/job/"]
    max_pages: 360
    max_jobs: 800

  # Northern German naval shipbuilding, ship repair, ILS and project management.
  - name: "NVL Naval Shipbuilding Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://jobportal.nvl.de/defence/viewAusschreibungen.html"
    allowed_domains: ["jobportal.nvl.de"]
    follow_url_contains: ["/defence/viewAusschreibungen.html"]
    job_url_regex: "/defence/viewAusschreibung/[0-9]{4}-[0-9]+\\.html$"
    max_pages: 180
    max_jobs: 350

  # PALFINGER industrial and marine service vacancies in Germany.
  - name: "PALFINGER Germany Service"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://career.palfinger.com/search/?q=&locationsearch=Germany"
    allowed_domains: ["career.palfinger.com"]
    follow_url_contains: ["/search/", "/go/"]
    job_url_contains: ["/job/"]
    max_pages: 220
    max_jobs: 500

  # Broader German industrial bridge: maintenance, commissioning, plant service
  # and shipbuilding roles, including TKMS/Rheinmetall-linked opportunities.
  - name: "thyssenkrupp Germany Engineering"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://jobs.thyssenkrupp.com/de/search/"
    allowed_domains: ["jobs.thyssenkrupp.com"]
    follow_url_contains: ["/de/search/"]
    job_url_regex: "/(de|en)/job/.+"
    max_pages: 320
    max_jobs: 850
