services:
  agent:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - agent_data:/data

  wife-agent:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.wife_agent"]
    env_file:
      - .env
    environment:
      JOB_AGENT_DB_PATH: /data/wife-agent.db
    volumes:
      - ./wife_config.yaml:/app/wife_config.yaml:ro
      - wife_agent_data:/data

  minden-housing:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.housing_entrypoint"]
    env_file:
      - /home/ultbear/minden-radar/.env
    environment:
      RADAR_HOME_CITY: Minden
      RADAR_RADIUS_KM: "15"
      HOUSING_DB_PATH: /data/housing.db
      HOUSING_SCAN_INTERVAL_SECONDS: "1800"
    volumes:
      - /home/ultbear/minden-radar/data:/data

  minden-housing-sale:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.housing_sale_entrypoint"]
    env_file:
      - /home/ultbear/minden-radar/.env
    environment:
      RADAR_HOME_CITY: Minden
      HOUSING_SALE_RADIUS_KM: "10"
      HOUSING_SALE_DB_PATH: /data/housing-sale.db
      HOUSING_SALE_SCAN_INTERVAL_SECONDS: "1800"
    volumes:
      - /home/ultbear/minden-radar/data:/data

  minden-tours:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.tour_entrypoint"]
    env_file:
      - /home/ultbear/minden-radar/.env
    environment:
      TOUR_DEPARTURE_START: "2026-08-24"
      TOUR_DEPARTURE_END: "2026-08-31"
      TOUR_RETURN_BY: "2026-09-02"
      TOUR_DB_PATH: /data/tour-deals.db
      TOUR_SCAN_INTERVAL_SECONDS: "1800"
    volumes:
      - /home/ultbear/minden-radar/data:/data

volumes:
  agent_data:
  wife_agent_data:
