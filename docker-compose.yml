services:
  agent:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - agent_data:/data

  wife-agent:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.wife_agent"]
    env_file:
      - .env
    environment:
      JOB_AGENT_DB_PATH: /data/wife-agent.db
    volumes:
      - ./wife_config.yaml:/app/wife_config.yaml:ro
      - wife_agent_data:/data

  minden-housing:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.housing_agent"]
    env_file:
      - /home/ultbear/minden-radar/.env
    environment:
      RADAR_HOME_CITY: Minden
      RADAR_RADIUS_KM: "15"
      HOUSING_DB_PATH: /data/housing.db
      HOUSING_SCAN_INTERVAL_SECONDS: "1800"
    volumes:
      - /home/ultbear/minden-radar/data:/data

volumes:
  agent_data:
  wife_agent_data:
