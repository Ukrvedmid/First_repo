    - "servicekraft"
    - "verkaufshilfe"
    - "aushilfe verkauf"
    - "bürohilfe"
    - "büroassistenz"

  positive_terms:
    - "quereinstieg"
    - "quereinsteiger"
    - "berufseinsteiger"
    - "ohne berufserfahrung"
    - "einarbeitung"
    - "teilzeit"
    - "vollzeit"
    - "minijob"
    - "familienfreundlich"
