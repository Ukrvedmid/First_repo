    - "niveau a1"
    - "deutsch a2"
    - "deutschkenntnisse a2"
    - "niveau a2"
    - "deutsch b1"
    - "deutschkenntnisse b1"
    - "niveau b1"
    - "grundkenntnisse deutsch"
    - "grundkenntnisse der deutschen sprache"
    - "einfache deutschkenntnisse"
    - "basiskenntnisse deutsch"
    - "deutsch grundkenntnisse"

  language_reject:
    - "deutsch b2"
    - "deutschkenntnisse b2"
    - "niveau b2"
    - "german b2"
    - "deutsch c1"
    - "deutschkenntnisse c1"
    - "niveau c1"
    - "german c1"
    - "deutsch c2"
    - "deutschkenntnisse c2"
