sources:
  # Boskalis' generic vacancy search is JavaScript-driven. The discipline pages
  # are rendered server-side and expose their highlighted vacancy links.
  - name: "Boskalis Careers"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://careers.boskalis.com/option/function/superintendents"
      - "https://careers.boskalis.com/option/function/engineering-1"
      - "https://careers.boskalis.com/option/function/project-management"
      - "https://careers.boskalis.com/option/function/sheq"
      - "https://careers.boskalis.com/option/function/crew"
    allowed_domains: ["careers.boskalis.com"]
    job_url_regex: "/vacancy/[0-9]+/[^/?#]+/?$"
    max_pages: 60
    max_jobs: 200

  # DOF's public website loads its vacancy list with JavaScript. DOF uses the
  # Workable account 'dof', whose public JSON endpoint exposes published jobs.
  - name: "DOF Careers"
    type: "workable"
    enabled: true
    account: "dof"

  # High-value German searches for shore-based service of marine machinery and
  # shipboard equipment: commissioning, field service, maintenance and support.
  - name: "Bundesagentur Marine Service Commissioning"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Commissioning%20Engineer%20Marine"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Field%20Service%20Engineer%20Marine"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Service%20Engineer%20Marine"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Technical%20Support%20Marine"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Marine%20Maintenance%20Engineer"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Inbetriebnahmeingenieur%20Schiff"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Serviceingenieur%20Schiff"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Servicetechniker%20Schiff"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Instandhaltungsingenieur%20Schiff"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Schiffsmotor%20Service"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Schiffsantrieb%20Service"
      - "https://www.arbeitsagentur.de/jobsuche/suche?angebotsart=1&sort=moddatum&was=Schiffsausr%C3%BCstung%20Service"
    allowed_domains: ["arbeitsagentur.de"]
    follow_url_contains: ["/jobsuche/suche?"]
    job_url_contains: ["/jobsuche/jobdetail/"]
    max_pages: 420
    max_jobs: 800
