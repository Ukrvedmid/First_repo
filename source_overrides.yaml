sources:
  # Immediate check of the strongest currently open Hamburg vacancy.
  - name: "Wartsila Priority Current"
    type: "crawl"
    enabled: true
    scan_priority: 1
    start_urls:
      - "https://careers.wartsila.com/job/Hamburg-Field-Service-Commissioning-Engineer/1428656833/"
    allowed_domains: ["careers.wartsila.com"]
    job_url_contains: ["/job/"]
    max_pages: 1
    max_jobs: 5

  # English-first shore roles in Germany that match a senior marine engineer.
  - name: "BSM Hamburg English Marine"
    type: "crawl"
    enabled: true
    scan_priority: 3
    start_urls:
      - "https://bsm.teamtailor.com/jobs/6931830-technical-superintendent-m-f-d-offshore"
      - "https://bsm.teamtailor.com/jobs/7959272-technical-superintendent-m-f-d-lng-bunker-vessels"
      - "https://bsm-bsm-cruise.teamtailor.com/jobs/7563765-assistant-technical-superintendent-cruise-m-f-d"
      - "https://bsm.teamtailor.com/"
    allowed_domains:
      - "bsm.teamtailor.com"
      - "bsm-bsm-cruise.teamtailor.com"
    job_url_contains: ["/jobs/"]
    max_pages: 80
    max_jobs: 250

  - name: "Peter Dohle Hamburg Shipmanagement"
    type: "crawl"
    enabled: true
    scan_priority: 4
    start_urls:
      - "https://doehle.jobs.personio.de/job/1350610?language=en"
      - "https://doehle.jobs.personio.de/?language=en"
    allowed_domains: ["doehle.jobs.personio.de"]
    follow_url_contains: ["doehle.jobs.personio.de/"]
    job_url_contains: ["/job/"]
    max_pages: 100
    max_jobs: 250

  - name: "Marine People Germany English"
    type: "crawl"
    enabled: true
    scan_priority: 5
    start_urls:
      - "https://marinepeople.com/jobs/14360-fleet-management-technical-superintendent-cruise-hamburg-germany/"
      - "https://marinepeople.com/jobs/"
    allowed_domains: ["marinepeople.com"]
    follow_url_contains: ["/jobs/"]
    job_url_regex: "/jobs/[0-9]+-[^/?#]+/?$"
    max_pages: 120
    max_jobs: 300

  # Hamburg ship management employer with current onshore superintendent jobs.
  - name: "DAL JTE Hamburg Onshore"
    type: "crawl"
    enabled: true
    scan_priority: 6
    start_urls:
      - "https://careers.rantzau.de/home"
    allowed_domains: ["careers.rantzau.de"]
    follow_url_contains: ["careers.rantzau.de/"]
    job_url_contains: ["/job", "/jobs", "/position", "/vacanc"]
    max_pages: 120
    max_jobs: 250

  # Global ship manager; English-first international shore opportunities.
  - name: "VGroup Global Onshore"
    type: "crawl"
    enabled: true
    scan_priority: 7
    start_urls:
      - "https://vgroup.pinpointhq.com/"
    allowed_domains: ["vgroup.pinpointhq.com"]
    follow_url_contains: ["vgroup.pinpointhq.com/"]
    job_url_contains: ["/postings/", "/jobs/", "/vacancies/"]
    max_pages: 220
    max_jobs: 500

  # Carnival's current corporate ATS includes Hamburg marine/technical jobs.
  - name: "Carnival Maritime Current ATS"
    type: "crawl"
    enabled: true
    scan_priority: 8
    start_urls:
      - "https://jobs.carnivalcorp.com/search-jobs/Hamburg%2C%20Germany/40306/4/2921044-2911297-2911298-2911299/53x5507/9x993"
      - "https://jobs.carnivalcorp.com/search-jobs/marine/Hamburg%2C%20Germany/40306/1/4/2921044-2911297-2911298-2911299/53x5507/9x993/50/2"
    allowed_domains: ["jobs.carnivalcorp.com"]
    follow_url_contains: ["/search-jobs/", "/job/"]
    job_url_contains: ["/job/"]
    max_pages: 180
    max_jobs: 450

  # Broad Germany search remains enabled for future Wärtsilä vacancies.
  - name: "Wartsila Germany"
    type: "crawl"
    enabled: true
    scan_priority: 30
    start_urls:
      - "https://careers.wartsila.com/search/?q=&locationsearch=Germany"
      - "https://careers.wartsila.com/go/Engineering/2983401/?sortColumn=referencedate&sortDirection=desc"
    allowed_domains: ["careers.wartsila.com"]
    follow_url_contains: ["/search/", "/go/"]
    job_url_contains: ["/job/"]
    job_url_excludes: ["1428656833"]
    max_pages: 180
    max_jobs: 500

  - name: "SCHOTTEL Priority Current"
    type: "crawl"
    enabled: true
    scan_priority: 2
    start_urls:
      - "https://jobs.schottel.de/Projektingenieur-mwd-Technischer-Support-de-j398.html"
      - "https://jobs.schottel.de/Service-Techniker-mwd-Aussendienst-de-j250.html"
    allowed_domains: ["jobs.schottel.de"]
    job_url_regex: "/[^/?#]+-de-j[0-9]+\\.html$"
    max_pages: 2
    max_jobs: 10

  - name: "SCHOTTEL Marine Propulsion"
    type: "crawl"
    enabled: true
    scan_priority: 40
    start_urls:
      - "https://jobs.schottel.de/"
    allowed_domains: ["jobs.schottel.de"]
    follow_url_contains: ["jobs.schottel.de/"]
    job_url_regex: "/[^/?#]+-de-j[0-9]+\\.html$"
    job_url_excludes:
      - "j398.html"
      - "j250.html"
      - "Ausbildung"
      - "Duales-Studium"
      - "Praktikum"
    max_pages: 180
    max_jobs: 400

  - name: "Boskalis Careers"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://careers.boskalis.com/option/function/superintendents"
      - "https://careers.boskalis.com/option/function/engineering-1"
      - "https://careers.boskalis.com/option/function/project-management"
      - "https://careers.boskalis.com/option/function/sheq"
      - "https://careers.boskalis.com/option/function/crew"
    allowed_domains: ["careers.boskalis.com"]
    job_url_regex: "/vacancy/[0-9]+/[^/?#]+/?$"
    max_pages: 150
    max_jobs: 400

  - name: "DOF Careers"
    type: "workable"
    enabled: true
    account: "dof"

