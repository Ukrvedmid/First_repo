  - "germany"
  - "deutschland"
  - "hamburg"
  - "bremen"
  - "bremerhaven"
  - "kiel"
  - "rostock"
  - "lübeck"
  - "hannover"
  - "niedersachsen"
  - "north rhine-westphalia"
  - "nordrhein-westfalen"
  - "nrw"
  - "minden"
  - "rheine"
  - "duisburg"
  - "essen"
  - "dortmund"
  - "düsseldorf"
  - "augsburg"
  - "ravensburg"
  - "erlangen"
  - "berlin"

minimum_score: 6

sources:
  - name: "Boskalis Careers"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://careers.boskalis.com/vacancies?_locale=en"
    allowed_domains: ["careers.boskalis.com"]
    follow_url_contains: ["/vacancies"]
    job_url_contains: ["/vacancy/"]
    max_pages: 80
    max_jobs: 250

  - name: "DOF Careers"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://www.dof.com/vacancies"
    allowed_domains: ["dof.com"]
    follow_url_contains: ["/vacancies"]
    job_url_contains: ["/vacancies/"]
    max_pages: 120
    max_jobs: 250

  - name: "Subsea7 Careers"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://careers.subsea7.com/viewalljobs/?locale=en_GB"
      - "https://careers.subsea7.com/go/All-Offshore-Jobs/9310855/"
    allowed_domains: ["careers.subsea7.com"]
    follow_url_contains: ["/viewalljobs/", "/go/"]
    job_url_contains: ["/job/"]
    max_pages: 100
    max_jobs: 300

  - name: "BSM Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://bsm.teamtailor.com/jobs"
    allowed_domains: ["bsm.teamtailor.com"]
    follow_url_contains: ["/jobs"]
    job_url_contains: ["/jobs/"]
    max_pages: 120
    max_jobs: 300

  - name: "Carnival Maritime Hamburg"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://www.carnival-maritime.com/careers/jobs-on-shore.36108.html"
    allowed_domains: ["carnival-maritime.com"]
    follow_url_contains: ["/careers/jobs-on-shore"]
    job_url_contains: ["/careers/jobs-detail"]
    max_pages: 100
    max_jobs: 250

  - name: "DNV Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://jobs.dnv.com/locations/germany"
      - "https://jobs.dnv.com/our-business/maritime"
    allowed_domains: ["jobs.dnv.com"]
    follow_url_contains: ["/locations/germany", "/our-business/maritime"]
    job_url_contains: ["/job-search/"]
    max_pages: 150
    max_jobs: 350

  - name: "Wartsila Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://careers.wartsila.com/search/?q=&locationsearch=Germany"
    allowed_domains: ["careers.wartsila.com"]
    follow_url_contains: ["/search/", "/go/"]
    job_url_contains: ["/job/"]
    max_pages: 150
    max_jobs: 400

  - name: "Everllence Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://jobs.everllence.com/search/?q=&locationsearch=Germany"
    allowed_domains: ["jobs.everllence.com"]
    follow_url_contains: ["/search/", "/go/"]
    job_url_contains: ["/job/"]
    max_pages: 150
    max_jobs: 400

  - name: "Vestas Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://careers.vestas.com/search/?q=&locationsearch=Germany"
    allowed_domains: ["careers.vestas.com"]
    follow_url_contains: ["/search/", "/go/"]
    job_url_contains: ["/job/"]
    max_pages: 150
    max_jobs: 400

  - name: "Siemens Energy Germany"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://jobs.siemens-energy.com/en_US/CareersMarketplace/searchJobsGermany/"
    allowed_domains: ["jobs.siemens-energy.com"]
    follow_url_contains: ["/CareersMarketplace/", "/jobs/"]
    job_url_contains: ["/FolderDetail/"]
    max_pages: 180
    max_jobs: 500
