interval_minutes: 30
request_timeout_seconds: 25
user_agent: "PersonalMarineJobAgent/1.2-shore-strict"

# Precision-first profile: only shore-based roles that map directly to a
# Chief Engineer / marine engineering background. Generic industrial,
# warehouse, sales, pure wind-turbine and seagoing vacancies are filtered out.
keywords:
  priority:
    # Fleet / vessel technical management
    - "technical superintendent"
    - "fleet technical superintendent"
    - "senior technical superintendent"
    - "assistant technical superintendent"
    - "marine superintendent"
    - "fleet superintendent"
    - "ship superintendent"
    - "newbuilding superintendent"
    - "drydock superintendent"
    - "technical vessel manager"
    - "technical fleet manager"
    - "technical manager marine"
    - "port engineer"
    - "fleet maintenance superintendent"
    - "fleet maintenance manager"

    # Class / survey / inspection
    - "marine surveyor"
    - "marine warranty surveyor"
    - "ship surveyor"
    - "machinery surveyor"
    - "marine inspector"
    - "technical expert marine"
    - "marine technical expert"
    - "dp assurance engineer"
    - "dp fmea surveyor"

    # Marine OEM / service / commissioning
    - "marine service engineer"
    - "service engineer marine"
    - "field service engineer marine"
    - "service technician marine"
    - "marine service technician"
    - "service manager marine"
    - "service project manager marine"
    - "serviceingenieur marine"
    - "serviceingenieur schiff"

    # Shipyard / drydock / marine projects
    - "marine project engineer"
    - "project engineer shipbuilding"
    - "project manager shipbuilding"
    - "project manager marine projects"
    - "marine projects manager"
    - "shipbuilding project manager"
    - "shipbuilding engineer"
    - "projektingenieur schiffbau"
    - "projektleiter schiffbau"
    - "projektleiter marineprojekte"
    - "projektmanager schiffbau"
    - "bauleiter schiffbau"

    # Engineering support tied to vessels/fleets
    - "vessel performance engineer"
    - "fleet performance engineer"
    - "marine maintenance engineer"
    - "marine reliability engineer"
    - "marine technical support engineer"
    - "schiffsbetriebsingenieur"
    - "ingenieur schiffsbetriebstechnik"
    - "ingenieur schiffstechnik"
    - "technischer schiffsinspektor"
    - "schiffsinspektor"

  # These terms help score a vacancy only after the matcher has confirmed a
  # genuine maritime context. Keep them engineering-specific, not generic.
  strong:
    - "chief engineer qualification"
    - "marine engineering"
    - "ship management"
    - "fleet management"
    - "vessel management"
    - "marine systems"
    - "ship machinery"
    - "ship engine"
    - "ship engines"
    - "marine propulsion"
    - "ship propulsion"
    - "azimuth thruster"
    - "controllable pitch propeller"
    - "planned maintenance system"
    - "drydock"
    - "dry dock"
    - "shipyard"
    - "ship repair"
    - "newbuilding"
    - "sea trials"
    - "classification society"
    - "class society"
    - "class survey"
    - "flag state"
    - "ism code"
    - "marpol"
    - "solas"
    - "dp vessel"
    - "dynamic positioning"
    - "schiffsbetriebstechnik"
    - "schiffstechnik"
    - "schiffsmaschine"
    - "schiffsmaschinen"
    - "schiffsmotor"
    - "schiffsmotoren"
    - "schiffsantrieb"
    - "schiffswerft"
    - "werftzeit"
    - "trockendock"
    - "klassifikationsgesellschaft"

  # No generic bridge jobs: precision is more important than volume.
  bridge: []
  weak: []

  # Seagoing / offshore field roles are explicitly rejected for this bot.
  sea:
    - "chief engineer"
    - "relief chief engineer"
    - "offshore chief engineer"
    - "first engineer"
    - "second engineer"
    - "2nd engineer"
    - "rov pilot technician"
    - "senior rov pilot technician"
    - "trainee rov pilot technician"
    - "rov supervisor"
    - "subsea technician"
    - "subsea engineer"
    - "dp maintenance engineer"

  negative:
    - "working student"
    - "werkstudent"
    - "internship"
    - "intern"
    - "praktikum"
    - "apprentice"
    - "ausbildung"
    - "student assistant"
    # seagoing jobs
    - "chief engineer"
    - "relief chief engineer"
    - "offshore chief engineer"
    - "first engineer"
    - "second engineer"
    - "2nd engineer"
    - "rov pilot technician"
    - "rov supervisor"
    - "subsea technician"
    - "subsea engineer"
    # pure offshore-wind/site operations rather than marine engineering
    - "offshore site manager"
    - "offshore installation manager"
    - "offshore operations manager"
    - "offshore production manager"
    - "offshore asset manager"
    - "offshore maintenance manager"
    - "offshore operations engineer"
    - "offshore maintenance engineer"
    - "production manager sov"
    - "sov manager"

priority_locations:
  - "germany"
  - "deutschland"
  - "hamburg"
  - "bremen"
  - "bremerhaven"
  - "kiel"
  - "rostock"
  - "lübeck"
  - "hannover"
  - "niedersachsen"
  - "north rhine-westphalia"
  - "nordrhein-westfalen"
  - "nrw"
  - "minden"
  - "rheine"
  - "duisburg"
  - "essen"
  - "dortmund"
  - "düsseldorf"
  - "augsburg"
  - "ravensburg"
  - "erlangen"
  - "berlin"

# A direct shore title normally scores around 27+ before additional engineering
# evidence. 26 rejects most generic project/service/maintenance jobs while
# retaining genuine maritime technical vacancies.
minimum_score: 26

sources:
  - name: "Boskalis Careers"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://careers.boskalis.com/vacancies?_locale=en"
    allowed_domains: ["careers.boskalis.com"]
    follow_url_contains: ["/vacancies"]
    job_url_contains: ["/vacancy/"]
    max_pages: 80
    max_jobs: 250

  - name: "DOF Careers"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://www.dof.com/vacancies"
    allowed_domains: ["dof.com"]
    follow_url_contains: ["/vacancies"]
    job_url_contains: ["/vacancies/"]
    max_pages: 120
    max_jobs: 250

  - name: "Subsea7 Careers"
    type: "crawl"
    enabled: true
    start_urls:
      - "https://careers.subsea7.com/viewalljobs/?locale=en_GB"
